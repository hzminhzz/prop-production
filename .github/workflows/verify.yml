# Optional manual diagnostics only; authoritative engineering checks run on the VPS.
# This workflow is not a required gate and never auto-runs on push or PR.
name: verify-manual
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen mypy
      - run: uv build --no-sources
      - run: uv run --frozen prop-production smoke
