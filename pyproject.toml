[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prop-production"
version = "0.1.0"
description = "Account-guarded copytrading runtime with no live execution route"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["cryptography==46.0.3"]

[project.optional-dependencies]
connector = ["trading-connector-library @ git+https://github.com/hzminhzz/trading-connector.git@b28aa8522c51830a4b389a61b20ceb539b7a89ca"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2"]

[project.scripts]
prop-production = "prop_production.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prop_production"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
